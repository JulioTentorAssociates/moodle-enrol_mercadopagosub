# Moodle Plugin CI for enrol_mercadopagosub.
#
# Same shape as enrol_mercadopagocpro's workflow, which is deliberate: both
# plugins target the same Moodle release and the same two database engines, and
# a difference between the two files should mean something rather than being
# drift. Diff them before changing either.
#
# Runs the eight checks the Moodle Marketplace runs as automated prechecks
# (moodle-plugin-ci bundles moodlehq/moodle-cs and moodlehq/moodle-local_ci,
# which are those checks), plus the PHPUnit suite, across both database engines.
# Behat is deliberately not run here -- see the note at the end of this file.
#
# The PostgreSQL leg is not optional decoration: "your SQL fails on PostgreSQL
# even when working on MySQL" is an explicit approval blocker. This plugin's
# privacy provider is the immediate reason it matters here -- its queries use
# LOWER() on both sides of an email comparison and a subquery in a delete, and
# those are exactly the constructs that behave differently between engines.
#
# Option names and step shape change between moodle-plugin-ci minor releases.
# Diff against the current template at https://moodlehq.github.io/moodle-plugin-ci/
# before changing anything here.

name: Moodle Plugin CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Overlapping pushes compete for runners against each other. Cancel the older
# run for the same ref; a cancelled run here is normal and not a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        # Production runs MariaDB 12.3 LTS. Bump this once the tag is confirmed
        # to exist and Moodle 5.2 is happy with it; 11 is the safe floor.
        image: mariadb:11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # The branch, not a tag, and deliberately. From v1.0.1 the supported
        # release is 5.2.3 or later — 5.2.2 is not supported, on Moodle's own
        # advice to skip it for a grade-calculation defect 5.2.3 fixes — and the
        # tip of MOODLE_502_STABLE is 5.2.3 and everything after it. Pinning a
        # 5.2.3 tag would test the floor and stop noticing the ceiling, which is
        # the wrong way round for a plugin whose whole compatibility question is
        # "does it still work on current 5.2".
        moodle-branch: ['MOODLE_502_STABLE']
        database: ['pgsql', 'mariadb']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, intl, soap, xml, mbstring, curl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
              moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # The eight checks below mirror the Marketplace prechecks. `if: !cancelled()`
      # makes every one run even after an earlier failure, so a single push
      # reports the full picture instead of one error at a time.

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # This plugin has no tests/ directory yet, and moodle-plugin-ci reports
      # "No PHPUnit tests to run" and exits 0 in that case, so this step is
      # green-but-empty until the suite exists. Do not read an early green run
      # as evidence that anything was tested.
      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Behat is deliberately NOT run here.
      #
      # It is not required for publication: the Moodle plugin contribution
      # checklist does not mention automated tests at all, and the Marketplace
      # prechecks are the eight steps above. This plugin also cannot be fully
      # exercised under moodle-plugin-ci, which serves Behat over plain http on
      # localhost:8000, while the plugin refuses to enable an enrolment instance
      # on a site that is not served over HTTPS.
      #
      # Measured on enrol_mercadopagocpro 2026-09-04, so nobody has to
      # rediscover it: `moodle-plugin-ci behat --tags=X` REPLACES the
      # `@enrol_mercadopagosub` tag the tool builds by default rather than
      # adding to it. Passing a bare negation therefore runs the whole of
      # Moodle's own Behat suite -- 3150+ steps and still going at 35 minutes.
      # If this step is ever added, both conditions have to be in one
      # expression:
      #
      #   moodle-plugin-ci behat --profile chrome \
      #       --tags='@enrol_mercadopagosub&&~@enrol_mercadopagosub_https'
      #
      # and give it a timeout-minutes so a hang cannot burn an hour of runner
      # time. Run Behat on the HTTPS development site before each release
      # instead.
